<!doctype html>
<!-- Chrome Web Store small promo tile (440x280), rendered by scripts/render-icons.sh -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #1c2128, #161b22);
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 0 32px;
    box-sizing: border-box;
  }
  img { width: 112px; height: 112px; flex: none; filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.45)); }
  h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.1; }
  .for { margin: 2px 0 14px; font-size: 18px; color: #8b949e; }
  p { margin: 0; font-size: 15px; line-height: 1.4; color: #c9d1d9; }
  .live { color: #3fb950; font-weight: 600; }
</style>
</head>
<body>
  <img src="../icon.svg" alt="">
  <div>
    <h1>Live Actions</h1>
    <div class="for">for GitHub</div>
    <p>Workflow progress, <span class="live">live</span><br>right inside GitHub.</p>
  </div>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # GitHub가 PR 이벤트를 놓쳐 CI가 안 돌았을 때 브랜치를 골라 직접 실행
  workflow_dispatch:

permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      - name: Upload extension build
        uses: actions/upload-artifact@v7
        with:
          name: live-actions-${{ github.sha }}
          path: dist/
          retention-days: 14
